name: Paper research settlement and close samples

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-research-worker
  cancel-in-progress: false

jobs:
  sync:
    if: vars.RESEARCH_WORKER_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      RESEARCH_DATABASE_URL: ${{ secrets.RESEARCH_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install worker dependencies
        if: env.ODDS_API_KEY != '' && env.RESEARCH_DATABASE_URL != ''
        run: pip install -r requirements.txt
      - name: Sync research journal
        if: env.ODDS_API_KEY != '' && env.RESEARCH_DATABASE_URL != ''
        run: python -m scripts.sync_research
      - name: Explain missing configuration
        if: env.ODDS_API_KEY == '' || env.RESEARCH_DATABASE_URL == ''
        run: echo "Worker skipped. Configure private API and external PostgreSQL repository secrets."
