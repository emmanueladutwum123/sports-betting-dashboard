name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Lint
        run: ruff check src tests app.py scripts
      - name: Test
        run: python -m pytest tests/ -q
      - name: Import check (app boots without a live API key)
        run: python -c "import src.picks, src.arbitrage, src.backtest, src.ledger, src.models.dixon_coles"
