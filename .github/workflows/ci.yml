name: CI

on:
  push:
    branches: [main, "feat/**", "audit/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: research_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:integration-only@localhost:5432/research_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Lint
        run: ruff check src tests app.py scripts
      - name: Test
        run: python -m pytest tests/ -q
      - name: Import check (app boots without a live API key)
        run: python -c "import src.picks, src.arbitrage, src.backtest, src.ledger, src.models.dixon_coles"
